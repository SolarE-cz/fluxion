# Home Assistant Add-on Configuration
name: FluxION ECS
version: "0.1.4"
slug: fluxion
description: "Solar plant automation based on electricity spot prices"
url: "https://github.com/SolarE-cz/fluxion"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
hassio_role: default
homeassistant_api: true

# Ingress configuration for web UI
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power

# Addon options schema
options:
  debug_mode: true
  log_level: "info"
  inverters:
    - id: "solax"
      vendor: "solax"
      entity_prefix: "solax"
      topology: "independent"
      min_battery_soc: 10
      max_battery_soc: 100
  pricing:
    spot_price_entity: "sensor.current_spot_electricity_prices"
    use_spot_prices_to_buy: true
    use_spot_prices_to_sell: true
    fixed_buy_prices: []
    fixed_sell_prices: []
  control:
    maximum_export_power_w: 10000
    force_charge_hours: 4
    force_discharge_hours: 2
    min_battery_soc: 10
    max_battery_soc: 100
  system:
    debug_mode: true
    update_interval_secs: 60
    log_level: "info"

schema:
  inverters:
    - id: str
      vendor: list(solax|fronius|sma)?
      entity_prefix: str
      topology: list(independent|master|slave)?
      master: str?
      slaves:
        - str?
  pricing:
    spot_price_entity: str
    use_spot_prices_to_buy: bool?
    use_spot_prices_to_sell: bool?
    fixed_buy_prices:
      - float?
    fixed_sell_prices:
      - float?
  control:
    maximum_export_power_w: int(0,)?
    force_charge_hours: int(0,24)?
    force_discharge_hours: int(0,24)?
    min_battery_soc: float(0,100)?
    max_battery_soc: float(0,100)?
  system:
    debug_mode: bool
    update_interval_secs: int(10,3600)?
    log_level: list(trace|debug|info|warning|error)?

# Image configuration
image: "ghcr.io/solare-cz/fluxion-{arch}"

# Add-on labels
labels:
  org.opencontainers.image.title: "FluxION ECS"
  org.opencontainers.image.description: "Solar plant automation based on electricity spot prices"
  org.opencontainers.image.source: "https://github.com/SolarE-cz/fluxion"
  org.opencontainers.image.licenses: "CC-BY-NC-ND-4.0"
