[workspace]
members = [
  "crates/fluxion-core",
  "crates/fluxion-ha",
  "crates/fluxion-i18n",
  "crates/fluxion-integration-tests",
  "crates/fluxion-main",
  "crates/fluxion-solax",
  "crates/fluxion-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/SolarE-cz/fluxion"

[workspace.lints.rust]
# deny
unused_must_use = "deny"
# warn
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
# allow
deprecated = "allow"
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# lints from the clippy::pedantic group that are explicitly allowed
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_continue = "allow"
new_without_default = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# additional useful lints not coveded by clippy::pedantic
allow_attributes = "warn"
get_unwrap = "warn"
integer_division = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
implicit_clone = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
wildcard_enum_match_arm = "warn"


[workspace.dependencies]
# Centralize dependency versions here; all ha-addons must reference these via `workspace = true`
# Bevy dependencies
bevy_ecs = "0.17.2"
bevy_app = "0.17.2"
bevy_log = "0.17.2"
bevy_utils = "0.17.2"
bevy_tasks = "0.17.2"
# async runtime
tokio = { version = "1.47.1", features = ["full"] }
# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# HTTP client/server
reqwest = { version = "0.12.24", default-features = false, features = [
  "json",
  "rustls-tls",
] }
axum = "0.8.6"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
# CLI
clap = { version = "4", features = ["derive"] }
# Time handling
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
# Configuration
toml = "0.9.8"
# Logging/tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# Metrics
prometheus = "0.14.0"
warp = "0.4.2"
# Concurrency
parking_lot = "0.12.5"
futures-timer = "3.0.3"
crossbeam-channel = "0.5.15"
# Async traits
async-trait = "0.1.89"
# Data structures
ringbuffer = "0.16.0"
# CSV parsing
csv = "1.3.1"
# Web templating
askama = "0.14.0"
# Streaming
tokio-stream = "0.1.17"
# Plotting
plotters = { version = "0.3.7", default-features = false, features = [
  "svg_backend",
  "chrono",
  "line_series",
] }
# Internationalization
fluent = "0.17.0"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
intl-memoizer = "0.5.3"
# Testing dependencies
mockito = "1.7.0"
