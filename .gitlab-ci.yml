  stage: build
  needs: []
  script:
    - echo "Building aarch64 Home Assistant addon with Nix cross-compilation..."
    - nix build .#dockerImage-aarch64 -L 2>&1 | grep -E '(error|warning|Building|Finished)' || true
    - echo "Image built successfully"
    - |
      # Extract the gzipped tarball (Nix produces .tar.gz, crane needs .tar)
      gunzip -c result > /tmp/fluxion-aarch64.tar
    - echo "Uploading to registry..."
    - |
      # Use crane to push directly to registry without Docker daemon
      nix shell nixpkgs#go-containerregistry --command crane auth login \
        -u $CI_REGISTRY_USER \
        -p $CI_REGISTRY_PASSWORD \
        $CI_REGISTRY
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-aarch64.tar \
        $CI_REGISTRY_IMAGE/fluxion:$CI_COMMIT_SHORT_SHA-aarch64
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-aarch64.tar \
        $CI_REGISTRY_IMAGE/fluxion:latest-aarch64
    - echo "Pushing to GitHub Container Registry..."
    - |
      # Login to GitHub Container Registry
      nix shell nixpkgs#go-containerregistry --command crane auth login \
        -u $GITHUB_USER \
        -p $GITHUB_TOKEN \
        $GHCR_REGISTRY
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-aarch64.tar \
        $GHCR_IMAGE:$CI_COMMIT_SHORT_SHA-aarch64
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-aarch64.tar \
        $GHCR_IMAGE:latest-aarch64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

