# GitLab CI/CD Pipeline for FluxION ECS
# Energy Control System for PV plant automation - Rust implementation
# Builds and tests the Rust workspace and Home Assistant addon
# This pipeline is triggered from the parent pipeline in the repository root

# Define template for Nix-based jobs
# Using determinatesystems/nix-installer which is CI-friendly
.nix_job:
  image: ubuntu:latest
  variables:
    # Enable experimental features for flakes
    NIX_CONFIG: "experimental-features = nix-command flakes"
  before_script:
    # Install Nix on first run (cached via apt cache)
    - apt-get update && apt-get install -y curl xz-utils sudo git
    - |
      if ! command -v nix &> /dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux --no-confirm --init none
      fi
    # Source Nix environment
    - |
      if [ -f /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      elif [ -f ~/.nix-profile/etc/profile.d/nix.sh ]; then
        . ~/.nix-profile/etc/profile.d/nix.sh
      fi
    - export PATH="/nix/var/nix/profiles/default/bin:$PATH"
    - nix --version
    - cd fluxion

variables:
  # Docker image names
  ADDON_NAME: "fluxion"
  DOCKER_DRIVER: overlay2
  #CI_DEBUG_TRACE: true
  
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/solare-cz/fluxion

  # Rust build configuration (paths relative to fluxion directory)
  CARGO_HOME: $CI_PROJECT_DIR/fluxion/fluxion/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/fluxion/fluxion/target

# Cache Rust dependencies between builds
cache:
  key: ${CI_COMMIT_REF_SLUG}-fluxion
  paths:
    - fluxion/.cargo/
    - fluxion/target/

stages:
  - build
  - test
  - release
  - publish

# ============= Test Stage =============

# Run unit tests
# Note: Rust version is determined by rust-toolchain.toml in the workspace
test:unit:
  extends: .nix_job
  stage: test
  script:
    - nix --version
    - echo "Running unit tests..."
    - nix develop --command cargo test --workspace --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: always

# Check code quality with clippy
# Note: Rust version and components are determined by rust-toolchain.toml
test:clippy:
  extends: .nix_job
  stage: test
  script:
    - nix --version
    - echo "Running clippy..."
    - nix develop --command cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: always

# Check code formatting and license headers using nix fmt
# Verifies that all files are formatted and have CC-BY-NC-ND-4.0 headers
test:fmt:
  extends: .nix_job
  stage: test
  script:
    - nix --version
    - echo "Checking code formatting and license headers..."
    - |
      res=$(nix fmt -- --fail-on-change)
      if [ "$?" -ne 0 ]; then
        echo "❌ Code is not properly formatted or missing license headers!"
        echo ""
        echo "To fix this, run locally:"
        echo "  nix fmt"
        echo ""
        echo "This will:"
        echo "  - Add CC-BY-NC-ND-4.0 license headers to files missing them"
        echo "  - Format Rust code with rustfmt"
        echo "  - Format Nix, TOML, and other files"
        echo ""
        echo "Then commit the changes."
        exit 1
      fi
    - echo "✅ All files are properly formatted with correct license headers!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: always

# Security audit
# Note: Rust version is determined by rust-toolchain.toml in the workspace
test:audit:
  extends: .nix_job
  stage: test
  script:
    - nix --version
    - echo "Running security audit..."
    - nix develop --command bash -c "cargo install cargo-audit && cargo audit"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: always

# ============= Build Stage =============

# Build addon for amd64 using Nix
build:amd64:
  extends: .nix_job
  stage: build
  needs: []
  script:
    - echo "Building amd64 Home Assistant addon with Nix..."
    - nix build .#dockerImage-amd64 -L 2>&1 | grep -E '(error|warning|Building|Finished)' || true
    - echo "Image built successfully"
    - |
      # Extract the gzipped tarball (Nix produces .tar.gz, crane needs .tar)
      gunzip -c result > /tmp/fluxion-amd64.tar
    - echo "Uploading to registry..."
    - |
      # Use crane to push directly to registry without Docker daemon
      nix shell nixpkgs#go-containerregistry --command crane auth login \
        -u $CI_REGISTRY_USER \
        -p $CI_REGISTRY_PASSWORD \
        $CI_REGISTRY
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-amd64.tar \
        $CI_REGISTRY_IMAGE/fluxion:$CI_COMMIT_SHORT_SHA-amd64
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-amd64.tar \
        $CI_REGISTRY_IMAGE/fluxion:latest-amd64
    - echo "Pushing to GitHub Container Registry..."
    - |
      # Login to GitHub Container Registry
      nix shell nixpkgs#go-containerregistry --command crane auth login \
        -u $GITHUB_USER \
        -p $GITHUB_TOKEN \
        $GHCR_REGISTRY
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-amd64.tar \
        $GHCR_IMAGE:$CI_COMMIT_SHORT_SHA-amd64
    - |
      nix shell nixpkgs#go-containerregistry --command crane push \
        /tmp/fluxion-amd64.tar \
        $GHCR_IMAGE:latest-amd64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

# Build addon for aarch64 (ARM64) using Nix cross-compilation - for Raspberry Pi 4
build:aarch64:
